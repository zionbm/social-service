name: Deploy to Cloud Run

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-19f1fbd1-7f2d-4c34-9d9

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker buildx build --platform=linux/amd64 \
            -t europe-west1-docker.pkg.dev/project-19f1fbd1-7f2d-4c34-9d9/forawalk-repo/social-service:latest \
            --push .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy social-service \
            --image europe-west1-docker.pkg.dev/project-19f1fbd1-7f2d-4c34-9d9/forawalk-repo/social-service:latest \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated \
            --vpc-connector forawalk-connector \
            --vpc-egress all-traffic \
            --set-secrets MONGO_URI=MONGO_URI:latest,DB_NAME=DB_NAME:latest,JWT_SECRET=JWT_SECRET:latest \
            --set-env-vars AUTH_SERVICE_URL=https://auth-service-4gtk3m42ka-ew.a.run.app,LOCATION_SERVICE_URL=https://location-service-4gtk3m42ka-ew.a.run.app
